name: Publicar imagem Docker no GHCR

# Roda a cada push na main (deploy contínuo) e permite disparo manual.
# Publica SEMPRE duas tags: "latest" e o short-sha do commit — nunca só
# "latest", para sempre dar pra saber qual commit está rodando em produção.
# Ver docs/context/decisions.md (ADR-0008).
#
# IMAGE_NAME sai de github.repository, então o namespace acompanha o dono do
# repositório sozinho: ghcr.io/basilio-byte/dashboard-comercial.
# Nada de nome hard-coded para errar.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ⚠ Publicar sem verificar é publicar defeito. O workflow anterior buildava e
  # empurrava a imagem direto, então um typecheck quebrado ou um teste vermelho
  # chegava em produção pelo caminho mais curto que existe.
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run test

  build-and-push:
    needs: verificar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadados (tags latest + short-sha)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
